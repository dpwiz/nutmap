[project]
name = "nutmap"
version = "0.1.0"
description = "Emoji semantic map and race-to-chestnut dataset pipeline"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2.8",
    "numpy>=2.0",
    "scipy>=1.14",
    "pillow>=11.0",
    "sentence-transformers>=5.0",
    "transformers>=4.56",
    "huggingface-hub>=0.34",
    "torch>=2.14",
    "triton-rocm>=3.8; sys_platform == 'linux'",
    "umap-learn>=0.5.7",
    "matplotlib>=3.9",
    "rich>=13.9",
    "filelock>=3.16",
    "zstandard>=0.25.0",
    "pyarrow>=26.0.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-rocm" }]
triton-rocm = [{ index = "pytorch-rocm" }]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
